<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open WaterDropping App</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f8fb;
        --card: #ffffff;
        --text: #183b56;
        --muted: #5f7487;
        --accent: #1389d3;
        --accent-soft: #e8f5fd;
        --border: #d7e4ee;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        background:
          radial-gradient(
            circle at top,
            #ffffff 0%,
            rgba(255, 255, 255, 0) 45%
          ),
          linear-gradient(180deg, #edf7fd 0%, var(--bg) 100%);
        color: var(--text);
      }

      .card {
        width: min(100%, 520px);
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 24px 80px rgba(24, 59, 86, 0.12);
        padding: 32px 28px;
        backdrop-filter: blur(10px);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(28px, 6vw, 38px);
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }

      .actions {
        display: none;
        gap: 12px;
        margin-top: 24px;
        flex-wrap: wrap;
      }

      .button {
        appearance: none;
        border: 0;
        border-radius: 14px;
        padding: 14px 18px;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
      }

      .button.primary {
        background: var(--accent);
        color: #ffffff;
      }

      .button.secondary {
        background: #eef4f8;
        color: var(--text);
      }

      .hint {
        margin-top: 20px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">WaterDropping</div>
      <h1 id="title">Opening the app...</h1>
      <p id="message">
        Please wait while we redirect you to the WaterDropping mobile app.
      </p>
      <div class="actions" id="actions">
        <a class="button primary" id="openLink" href="#">Open in App</a>
        <a class="button secondary" id="copyHint" href=".">Reload</a>
      </div>
      <p class="hint" id="hint"></p>
    </main>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var iosLink = params.get("ios");
        var androidLink = params.get("android");
        var fallbackLink = params.get("fallback");
        var sharedLink = params.get("link");

        var ua = navigator.userAgent || "";
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var isMobile = isAndroid || isIOS;

        var title = document.getElementById("title");
        var message = document.getElementById("message");
        var hint = document.getElementById("hint");
        var actions = document.getElementById("actions");
        var openLink = document.getElementById("openLink");
        var copyHint = document.getElementById("copyHint");

        var targetLink = sharedLink;
        if (isIOS) targetLink = iosLink || sharedLink;
        if (isAndroid) targetLink = androidLink || sharedLink;

        function showManualOpen(text, link) {
          title.textContent = "Open this link on your mobile device";
          message.textContent = text;
          hint.textContent = link
            ? "If you are already on mobile, tap the button below to continue."
            : "No mobile deep link was provided in this URL.";
          actions.style.display = link ? "flex" : "none";
          if (link) {
            openLink.href = link;
            copyHint.href = window.location.href;
          }
        }

        if (!isMobile) {
          showManualOpen(
            "This link is meant to open the WaterDropping app, so please open it from your phone.",
            targetLink,
          );
          return;
        }

        if (!targetLink) {
          title.textContent = "Deep link is missing";
          message.textContent =
            "This page could not find an iOS or Android app link to open.";
          hint.textContent =
            "Add ?ios=... or ?android=... to this URL, or use ?link=... for a shared deep link.";
          return;
        }

        openLink.href = targetLink;
        copyHint.href = fallbackLink || targetLink;

        setTimeout(function () {
          window.location.href = targetLink;
        }, 120);

        setTimeout(function () {
          title.textContent = "If nothing happened, open the app manually";
          message.textContent =
            "Some email apps and browsers block automatic app redirects. You can continue with the button below.";
          hint.textContent = fallbackLink
            ? "If the app is not installed, use the fallback link."
            : "If the app is not installed, install it first and try again.";
          actions.style.display = "flex";
          if (fallbackLink) {
            copyHint.textContent = "Open Fallback";
          } else {
            copyHint.textContent = "Try Again";
          }
        }, 1800);
      })();
    </script>
  </body>
</html>
